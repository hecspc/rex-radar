# XcodeGen spec for Rex Radar: the menu bar app and its desktop widget.
# scripts/build.sh generates RexRadar.xcodeproj from it; the project isn't checked in.
# DEVELOPMENT_TEAM comes from the environment (your Apple Development team ID).
name: RexRadar
options:
  bundleIdPrefix: house.milapan
  deploymentTarget:
    macOS: "26.0"
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    APP_GROUP: "$(DEVELOPMENT_TEAM).house.milapan.rex-radar"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    DEAD_CODE_STRIPPING: YES
targets:
  RexRadar:
    type: application
    platform: macOS
    sources:
      - path: Sources/RexRadar
      - path: Sources/Shared
      - path: ../watcher/rex-radar.lua
        buildPhase: resources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: house.milapan.rex-radar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: RexRadar
        INFOPLIST_FILE: Resources/RexRadar-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/RexRadar.entitlements
    dependencies:
      - target: RexRadarWidget
        embed: true
        codeSign: true
  RexRadarWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/RexRadarWidget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: house.milapan.rex-radar.widget
        PRODUCT_NAME: RexRadarWidget
        INFOPLIST_FILE: Resources/RexRadarWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/RexRadarWidget.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  RexRadarMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/RexRadarMobile
      - path: Sources/Shared
      - path: Resources/Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: house.milapan.rex-radar.ios
        PRODUCT_NAME: RexRadarMobile
        INFOPLIST_FILE: Resources/RexRadarMobile-Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: Resources/RexRadarMobile.entitlements
    dependencies:
      - target: RexRadarMobileWidget
        embed: true
        codeSign: true
      - target: RexRadarWatch
        embed: true
        codeSign: true
  RexRadarMobileWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/RexRadarWidget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: house.milapan.rex-radar.ios.widget
        PRODUCT_NAME: RexRadarMobileWidget
        INFOPLIST_FILE: Resources/RexRadarMobileWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/RexRadarMobileWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  RexRadarWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/RexRadarWatch
      - path: Sources/RexRadarMobile/HubClient.swift
      - path: Sources/Shared
        excludes:
          - QuestionsForm.swift
          - SkillPicker.swift
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: house.milapan.rex-radar.ios.watchkitapp
        PRODUCT_NAME: RexRadarWatch
        INFOPLIST_FILE: Resources/RexRadarWatch-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/RexRadarWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: RexRadarWatchWidget
        embed: true
        codeSign: true
  RexRadarWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: Sources/RexRadarWidget
      - path: Sources/Shared
        excludes:
          - QuestionsForm.swift
          - SkillPicker.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: house.milapan.rex-radar.ios.watchkitapp.widget
        PRODUCT_NAME: RexRadarWatchWidget
        INFOPLIST_FILE: Resources/RexRadarWatchWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/RexRadarWatchWidget.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
